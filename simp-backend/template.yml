AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  simp-backend FastAPI service (quiz + questions), run on Lambda via Mangum.

Parameters:
  DbHost:
    Type: String
    Description: Postgres host (e.g. Supabase connection pooler host)
  DbPort:
    Type: String
    Default: "6543"
  DbName:
    Type: String
    Default: postgres
  DbUser:
    Type: String
    Default: postgres
  DbPassword:
    Type: String
    NoEcho: true
  DbSslMode:
    Type: String
    Default: require

Resources:
  FastApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.13
      Handler: main.handler
      CodeUri: .
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          DB_SSLMODE: !Ref DbSslMode

      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
